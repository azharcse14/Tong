openapi: "3.0.0"

info:
  title: Chai Shop API ☕
  version: "1.0.0"
  description: চায়ের দোকানের menu API

servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /auth/register:
    post:
      summary: নতুন user বানাও
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: আজহার
              email: azhar@example.com
              password: chai1234
      responses:
        "201":
          description: রেজিস্ট্রেশন সফল
          content:
            application/json:
              example:
                success: true
                message: রেজিস্ট্রেশন সফল হয়েছে
                data:
                  id: 1
                  name: আজহার
                  email: azhar@example.com

  /auth/login:
    post:
      summary: Login করো
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: azhar@example.com
              password: chai1234
      responses:
        "200":
          description: Login সফল
          content:
            application/json:
              example:
                success: true
                message: লগইন সফল হয়েছে
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

  /menu:
    get:
      summary: Menu list দেখো
      tags:
        - Menu
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
        - name: search
          in: query
          description: নাম দিয়ে খোঁজো (Accept-Language header অনুযায়ী bn বা en এ খোঁজে)
          schema:
            type: string
          example: চা
        - name: min_price
          in: query
          description: এই দামের সমান বা বেশি item
          schema:
            type: number
            minimum: 0
          example: 20
        - name: max_price
          in: query
          description: এই দামের সমান বা কম item
          schema:
            type: number
            minimum: 0
          example: 50
      responses:
        "200":
          description: সফল
          content:
            application/json:
              example:
                success: true
                message: সফল হয়েছে
                data:
                  - id: 1
                    name: মিল্ক টি
                    price: 30
                    image_url: /uploads/1_123456789.jpg
                meta:
                  total: 1
                  page: 1
                  limit: 10
                  total_pages: 1

    post:
      summary: নতুন item যোগ করো
      tags:
        - Menu
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              name_bn: মিল্ক টি
              name_en: Milk Tea
              price: 30
      responses:
        "201":
          description: তৈরি হয়েছে
          content:
            application/json:
              example:
                success: true
                message: Menu item তৈরি হয়েছে
                data:
                  id: 1
                  name_bn: মিল্ক টি
                  name_en: Milk Tea
                  price: 30

  /menu/{id}:
    put:
      summary: Item আপডেট করো
      tags:
        - Menu
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            example:
              name_bn: লেবু চা
              name_en: Lemon Tea
              price: 25
      responses:
        "200":
          description: আপডেট হয়েছে
          content:
            application/json:
              example:
                success: true
                message: Menu item আপডেট হয়েছে
                data:
                  id: 1
                  name_bn: লেবু চা
                  name_en: Lemon Tea
                  price: 25

    delete:
      summary: Item মুছে ফেলো
      tags:
        - Menu
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: মুছে গেছে
          content:
            application/json:
              example:
                success: true
                message: Menu item মুছে ফেলা হয়েছে
                data: null

  /menu/{id}/image:
    post:
      summary: Menu item এ image যোগ করো
      tags:
        - Menu
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Image আপলোড হয়েছে
          content:
            application/json:
              example:
                success: true
                message: Image আপলোড হয়েছে
                data:
                  image_url: /uploads/1_123456789.jpg