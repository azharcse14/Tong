services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgresql://postgres:password@db:5432/chaidukan
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:19
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chaidukan
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5