services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgresql://postgres:password@db:5432/chaidukan
      PORT: 8080
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:19
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chaidukan
    ports:
      - "5433:5432"
    volumes:
      # নতুন DB তে নাম অনুযায়ী ক্রমে চলে; নতুন migration যোগ করলে এখানেও যোগ করো
      - ./migrations/000001_initial_schema.up.sql:/docker-entrypoint-initdb.d/000001.sql
      - ./migrations/000002_add_translations.up.sql:/docker-entrypoint-initdb.d/000002.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5